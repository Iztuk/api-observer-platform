services:
  juice-shop-a:
    image: bkimminich/juice-shop:latest
    restart: unless-stopped
    networks:
      - api-observer-test

  modsecurity-a:
    image: docker.io/owasp/modsecurity-crs:nginx
    restart: unless-stopped
    depends_on:
      - juice-shop-a
    ports:
      - "8082:8080"
    environment:
      BACKEND: "http://juice-shop-a:3000"
      PORT: "8080"

      MODSEC_RULE_ENGINE: "DetectionOnly"
      MODSEC_AUDIT_ENGINE: "On"
      MODSEC_AUDIT_LOG: "/var/log/modsecurity/modsec_audit.log"

      MODSEC_RESP_BODY_ACCESS: "On"
      MODSEC_RESP_BODY_MIMETYPE: "text/plain text/html text/xml application/json"

      BLOCKING_PARANOIA: "1"
      DETECTION_PARANOIA: "1"
    volumes:
      - ./logs/node-a:/var/log/modsecurity
    networks:
      - api-observer-test

  collector-a:
    image: localhost/api-observer-collector:dev
    restart: unless-stopped
    depends_on:
      - modsecurity-a
    command:
      - start
      - --background=false
      - --data-dir=/var/lib
      - --file-path=/logs/modsec_audit.log
      - --observer-ingest-addr=host.containers.internal:24899
      - --query-addr=:24900
      - --advertise-query-addr=127.0.0.1:24900
    ports:
      - "24900:24900"
    volumes:
      - ./logs/node-a:/logs:ro
      - collector-a-data:/var/lib/api-collector
    networks:
      - api-observer-test

  juice-shop-b:
