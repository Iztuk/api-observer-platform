services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    restart: unless-stopped

    networks:
      - api-observer-test

  modsecurity:
    image: docker.io/owasp/modsecurity-crs:nginx
    restart: unless-stopped

    depends_on:
      - juice-shop

    ports:
      - "8082:8080"

    environment:
      BACKEND: "http://juice-shop:3000"
      PORT: "8080"

      MODSEC_RULE_ENGINE: "DetectionOnly"
      MODSEC_AUDIT_ENGINE: "On"
      MODSEC_AUDIT_LOG: "/var/log/modsecurity/modsec_audit.log"

      MODSEC_RESP_BODY_ACCESS: "On"
      MODSEC_RESP_BODY_MIMETYPE: "text/plain text/html text/xml application/json"

      BLOCKING_PARANOIA: "1"
      DETECTION_PARANOIA: "1"

    volumes:
      - ./logs:/var/log/modsecurity

    networks:
      - api-observer-test

  collector:
    image: localhost/api-observer-collector:dev
    restart: unless-stopped

    depends_on:
      - modsecurity

    command:
      - start
      - --background=false
      - --file-path=/logs/modsec_audit.log
      - --observer-ingest-addr=host.containers.internal:24899
      - --query-addr=:24900

    ports:
      - "24900:24900"

    volumes:
      - ./logs:/logs:ro
      - collector-data:/var/lib/api-observer-collector

    networks:
      - api-observer-test

volumes:
  collector-data:

networks:
  api-observer-test:
