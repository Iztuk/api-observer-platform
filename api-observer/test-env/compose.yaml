services:
  test-app:
    image: nginx:alpine

  modsecurity:
    image: docker.io/owasp/modsecurity-crs:nginx

    depends_on:
      - test-app

    ports:
      - "8080:8080"

    environment:
      BACKEND: "http://test-app:80"
      PORT: "8080"

      MODSEC_RULE_ENGINE: "On"
      MODSEC_AUDIT_ENGINE: "On"
      MODSEC_AUDIT_LOG: "/var/log/modsec_audit.log"

      BLOCKING_PARANOIA: "1"
      DETECTION_PARANOIA: "1"

    volumes:
      - ./logs/modsec_audit.log:/var/log/modsec_audit.log
